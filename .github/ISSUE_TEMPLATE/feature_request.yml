name: ✨ 功能建议
description: 提出新的使用场景或功能改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量描述“使用场景”和“希望达到的结果”，而不只是一个功能名。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你现在如何完成这件事？哪一步最麻烦？
      placeholder: 例如：每天需要从网页上的名单里核对 200 个学号，再回到 Excel 查找。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望识文寻表怎么帮助你？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。现在是否有临时解决办法？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 屏幕框选 / OCR
        - Excel / CSV 读取
        - 搜索与匹配
        - 整行内容 / 复制
        - Excel 定位
        - 快捷键 / 窗口
        - 文档 / 安装
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与贡献
      options:
        - label: 我愿意提交 Pull Request 一起实现。
          required: false
