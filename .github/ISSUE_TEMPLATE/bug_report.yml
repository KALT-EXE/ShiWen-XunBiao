name: 🐞 Bug 反馈
description: 报告识别、查找、Excel 定位或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新版本，并尽量提供脱敏后的复现信息。
        **不要上传真实姓名、手机号、身份证号等敏感数据。**

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python / 安装包方式
      placeholder: 例如 Python 3.12 / 直接双击 exe
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题发生在哪一步？
      options:
        - 启动或界面
        - 框选屏幕
        - OCR 识别
        - Excel / CSV 读取
        - 查找结果
        - 整行内容 / 复制
        - 双击定位 Excel
        - 快捷键 / 窗口置顶
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述，越具体越好。
      placeholder: |
        1. 打开 ...
        2. 框选 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / 实际结果
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 错误提示或日志
      description: 可粘贴界面提示，或 `%APPDATA%\ShiWenXunBiao\app.log` 中的相关片段。
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除截图、表格和日志中的个人信息。
          required: true
        - label: 我已确认使用的是最新版本。
          required: true
